[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sfjsp-alns"
version = "0.2.0"
description = "Scenario-aware ALNS for stochastic flexible job-shop scheduling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "ortools>=9.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sfjsp-alns = "sfjsp_alns.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
